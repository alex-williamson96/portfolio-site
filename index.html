    <!--
      Resolves the theme before first paint so there is no flash. This has to be a
      synchronous inline script, which means it cannot import src/ui/themes.ts —
      the two theme arrays below are a deliberate duplicate. Keep them in sync;
      themes.ts is canonical, and both must stay a subset of tailwind.config.js.
    -->
    <script>
      (function () {
        var light = ["light","cupcake","bumblebee","emerald","corporate","retro","valentine","garden","lofi","pastel","fantasy","wireframe","cmyk","autumn","acid","lemonade","winter"];
        var dark = ["dark","synthwave","halloween","forest","aqua","black","luxury","dracula","business","night","coffee"];
        try {
          var scheme = localStorage.getItem("theme-scheme") || "system";
          var isDark = scheme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : scheme === "dark";
          var theme;
          if (localStorage.getItem("theme-random") === "on") {
            var pool = isDark ? dark : light;
            theme = pool[Math.floor(Math.random() * pool.length)];
          } else {
            theme = isDark ? "dark" : "winter";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage blocked (private mode, embedded) — keep the markup default */
        }
      })();
    </script>
